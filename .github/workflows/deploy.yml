name: Deploy to vvger.ru

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vvger-ru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composer dependencies
        if: hashFiles('composer.json') != ''
        uses: php-actions/composer@v6
        with:
          php_version: "8.3"
          args: --no-dev --optimize-autoloader --no-interaction

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "${port}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='README.md' \
            -e "ssh -p ${port}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Fix permissions and reload services
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          ssh -p "${port}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/vvger-reload-services.sh"
